
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionFlow</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b16;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:30px 18px;
}
h1{
  color:#9381ff;
  letter-spacing:5px;
  margin-top:45px;
}
.panel{
  background:#151a2b;
  padding:25px;
  border-radius:18px;
  margin-top:35px;
}
.status{color:#a99aff;font-size:24px}
button{
  background:#7561ff;
  color:white;
  border:0;
  padding:16px;
  border-radius:12px;
  width:100%;
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>
<body>
<h1>MOTIONFLOW</h1>
<p>GESTURE CONTROL SYSTEM</p>

<div class="panel">
  <p>SYSTEM STATUS</p>
  <div class="status">READY</div>
  <p>MotionFlow Engine v1.0</p>
</div>

<button onclick="alert('MotionFlow berhasil dijalankan!')">
START SYSTEM
</button>

</body>
</html>
