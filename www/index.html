HTML

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionFlow</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080b14;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
header{text-align:center;padding:20px}
h1{color:#9b83ff;letter-spacing:5px}
header p{color:#8991aa;font-size:12px;margin-top:8px}
.camera{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#111827;
  border:1px solid #7661ff;
  border-radius:18px;
  overflow:hidden;
  margin-top:20px;
}
video,canvas{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}
canvas{z-index:2}
.panel{
  background:#151a2b;
  border-radius:15px;
  padding:20px;
  margin-top:18px;
}
.small{font-size:11px;color:#929bb4}
#gesture{
  color:#a997ff;
  font-size:24px;
  font-weight:bold;
  margin-top:9px;
}
#details{color:#b4bdd2;margin-top:8px;font-size:13px}
button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#7862ff;
  color:white;
  font-weight:bold;
}
button:disabled{opacity:.5}
#points{color:#a997ff;margin-top:12px;font-size:13px}
</style>
</head>

<body>
<header>
  <h1>MOTIONFLOW</h1>
  <p>REAL-TIME GESTURE CONTROL</p>
</header>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="panel">
  <div class="small">DETECTED GESTURE</div>
  <div id="gesture">STANDBY</div>
  <div id="details">Kamera belum aktif</div>
  <div id="points">LANDMARKS: 0 / 21</div>
</div>

<button id="start">AKTIFKAN KAMERA</button>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "@mediapipe/tasks-vision";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const gesture=document.getElementById("gesture");
const details=document.getElementById("details");
const points=document.getElementById("points");

let tracker=null;
let stream=null;
let running=false;
let lastGesture="";
let lastChange=0;

const connections=[
[0,1],[1,2],[2,3],[3,4],
[0,5],[5,6],[6,7],[7,8],
[5,9],[9,10],[10,11],[11,12],
[9,13],[13,14],[14,15],[15,16],
[13,17],[17,18],[18,19],[19,20],
[0,17]
];

function classify(lm){
  const thumb=lm[4].y<lm[3].y;
  const index=lm[8].y<lm[6].y;
  const middle=lm[12].y<lm[10].y;
  const ring=lm[16].y<lm[14].y;
  const pinky=lm[20].y<lm[18].y;

  if(thumb && !index && !middle && !ring && !pinky)
    return "THUMBS UP";

  if(index && middle && ring && pinky)
    return "OPEN PALM";

  if(!index && !middle && !ring && !pinky)
    return "FIST";

  return "HAND DETECTED";
}

function drawHand(lm){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.lineWidth=4;
  ctx.strokeStyle="#9b82ff";
  ctx.shadowColor="#8b65ff";
  ctx.shadowBlur=12;

  for(const [a,b] of connections){
    ctx.beginPath();
    ctx.moveTo(lm[a].x*canvas.width,lm[a].y*canvas.height);
    ctx.lineTo(lm[b].x*canvas.width,lm[b].y*canvas.height);
    ctx.stroke();
  }

  ctx.shadowBlur=15;
  ctx.fillStyle="#ffffff";

  for(const p of lm){
    ctx.beginPath();
    ctx.arc(p.x*canvas.width,p.y*canvas.height,4,0,Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur=0;
}

async function init(){
  start.disabled=true;
  start.textContent="MENYIAPKAN ENGINE...";

  try{
    const vision=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    tracker=await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"CPU"
      },
      runningMode:"VIDEO",
      numHands:1
    });

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480}
      }
    });

    video.srcObject=stream;
    await video.play();

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    running=true;
    start.textContent="KAMERA AKTIF";
    gesture.textContent="SCANNING...";
    details.textContent="Arahkan tangan ke kamera";

    requestAnimationFrame(loop);

  }catch(e){
    console.error(e);
    gesture.textContent="ERROR";
    details.textContent=e.message;
    start.disabled=false;
    start.textContent="COBA LAGI";
  }
}

function loop(){
  if(!running)return;

  if(video.readyState>=2){
    const result=tracker.detectForVideo(video,performance.now());

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(result.landmarks.length){
      const lm=result.landmarks[0];
      drawHand(lm);

      const detected=classify(lm);
      const now=Date.now();

      if(detected!==lastGesture && now-lastChange>500){
        lastGesture=detected;
        lastChange=now;
      }

      gesture.textContent=lastGesture;
      details.textContent="Tangan berhasil terdeteksi";
      points.textContent="LANDMARKS: "+lm.length+" / 21";
    }else{
      gesture.textContent="SEARCHING...";
      details.textContent="Belum ada tangan terdeteksi";
      points.textContent="LANDMARKS: 0 / 21";
      lastGesture="";
    }
  }

  requestAnimationFrame(loop);
}

start.addEventListener("click",init);
</script>
</body>
</html>
